name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FoLAWy-py/WitX-Preview
          ref: main
          path: witx
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - working-directory: witx
        run: uv run --locked --no-dev --package witx-cloud witx plugin check "$GITHUB_WORKSPACE/plugins"
